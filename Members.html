<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members</title>
  <style>
    /* reset */
    html, body { margin:0; padding:0; }
    body { background: #fff; }

    /* the fixed spinner DIV, sits under the image */
    .loader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      background: rgba(255,255,255,0.9); /* optional pale white backdrop */
    }
    .loader::after {
      content: "";
      width: 60px; height: 60px;
      border: 8px solid #f3f3f3;
      border-top: 8px solid #49777F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* your poster SVG: full-width, auto height, always on top */
    img.poster {
      display: block;
      position: relative;
      z-index: 1;
      width: 100vw;
      height: auto;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }
    
    img.poster.loaded {
      opacity: 1;
    }
    
    /* Intersection observer for lazy loading */
    img.poster:not(.loaded) {
      background: #f5f5f5;
      min-height: 400px;
    }
    
    /* Individual loading spinner for each image */
    .poster-container {
      position: relative;
      width: 100vw;
    }
    
    .poster-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #49777F;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 2;
      display: none;
    }
    
    .poster-container.loading .poster-spinner {
      display: block;
    }
    
    .poster-container.loading img.poster {
      opacity: 0.1;
    }

    /* go-back button, always on top */
    .back-link {
      position: fixed;
      bottom: 20px; right: 20px;
      padding: 10px 20px;
      background-color: rgba(73,119,127,0.8);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- fixed loader behind the poster -->
  <div class="loader"></div>

  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (1).svg"
         alt="Poster 1">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (2).svg"
         alt="Poster 2">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (3).svg"
          alt="Poster 3">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (4).svg"
          alt="Poster 4">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (5).svg"  
          alt="Poster 5">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (6).svg"
          alt="Poster 6">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (7).svg"
          alt="Poster 7">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (8).svg"
          alt="Poster 8">
  </div>
  <div class="poster-container">
    <div class="poster-spinner"></div>
    <img class="poster"
         data-src="Images/poster (9).svg"
            alt="Poster 9">
  </div>

  <a href="index.html" class="back-link" aria-label="Go back">
    ← Go Back
  </a>

  <script>
    // Intersection Observer for progressive loading
    const observerOptions = {
      root: null,
      rootMargin: '50px',
      threshold: 0.1
    };

    const imageObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          const container = img.closest('.poster-container');
          loadImage(img, container);
          observer.unobserve(img);
        }
      });
    }, observerOptions);

    function loadImage(img, container) {
      const src = img.getAttribute('data-src');
      if (src) {
        // Show individual spinner
        if (container) {
          container.classList.add('loading');
        }
        
        img.src = src;
        img.onload = () => {
          img.classList.add('loaded');
          if (container) {
            container.classList.remove('loading');
          }
          checkAllLoaded();
        };
        img.onerror = () => {
          img.classList.add('loaded'); // Still mark as loaded to hide loader
          if (container) {
            container.classList.remove('loading');
          }
          checkAllLoaded();
        };
      }
    }

    let loadedCount = 0;
    function checkAllLoaded() {
      loadedCount++;
      const totalImages = document.querySelectorAll('img.poster').length;
      
      // Hide loader when first image loads for immediate feedback
      if (loadedCount === 1) {
        document.querySelector('.loader').style.opacity = '0.5';
      }
      
      // Completely hide loader when all visible images are loaded
      if (loadedCount >= Math.min(3, totalImages)) {
        document.querySelector('.loader').style.display = 'none';
      }
    }

    // Initialize intersection observer
    document.addEventListener('DOMContentLoaded', () => {
      const posters = document.querySelectorAll('img.poster');
      
      // Load first image immediately for better UX
      if (posters.length > 0) {
        const firstContainer = posters[0].closest('.poster-container');
        loadImage(posters[0], firstContainer);
      }
      
      // Observe all images for intersection
      posters.forEach(img => {
        imageObserver.observe(img);
      });
    });

    // Fallback for browsers without IntersectionObserver
    if (!('IntersectionObserver' in window)) {
      document.addEventListener('DOMContentLoaded', () => {
        const posters = document.querySelectorAll('img.poster');
        posters.forEach(img => {
          const container = img.closest('.poster-container');
          loadImage(img, container);
        });
      });
    }
  </script>

  <noscript>
    <style>
      .loader { display: none !important; }
    </style>
  </noscript>

</body>
</html>
